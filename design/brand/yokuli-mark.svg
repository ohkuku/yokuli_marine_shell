<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Yokuli OS — pixel sail</title>
  <desc>Original sixteen-cell sailing boat. Integer grid rectangles are shared with the live launch animation.</desc>
  <g id="sail" fill="#111111">
    <rect x="8" y="1" width="1" height="10"/>
    <rect x="7" y="3" width="1" height="1"/>
    <rect x="6" y="4" width="2" height="1"/>
    <rect x="5" y="5" width="3" height="1"/>
    <rect x="4" y="6" width="4" height="1"/>
    <rect x="3" y="7" width="5" height="1"/>
    <rect x="2" y="8" width="6" height="1"/>
    <rect x="1" y="9" width="7" height="1"/>
    <rect x="10" y="5" width="1" height="1"/>
    <rect x="10" y="6" width="2" height="1"/>
    <rect x="10" y="7" width="3" height="1"/>
    <rect x="10" y="8" width="4" height="1"/>
    <rect x="10" y="9" width="5" height="1"/>
  </g>
  <g id="hull" fill="#111111">
    <rect x="1" y="11" width="14" height="1"/>
    <rect x="2" y="12" width="12" height="1"/>
    <rect x="4" y="13" width="8" height="1"/>
  </g>
</svg>
