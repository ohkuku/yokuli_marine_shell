syntax = "proto3";

option java_package = "com.yokuli.shell.storage.proto";
option java_multiple_files = true;

message LauncherStateProto {
  int32 schema_version = 1;
  StartDocumentProto start_document = 2;
  string theme_mode = 3;
  string accent = 4;
  string language_tag = 5;
  bool layout_locked = 6;
  string last_launcher_page = 7;
  string last_foreground_token = 8;
  LauncherRecoveryProto recovery = 9;
  int32 product_model_version = 10;
  string measurement_unit_system = 11;
  string motion_preference = 12;
  map<string, string> app_preferences = 13;
  string workshop_draft = 14;
}

message StartDocumentProto {
  int32 schema_version = 1;
  string profile_id = 2;
  int32 default_layout_version = 3;
  repeated TilePlacementProto placements = 4;
  repeated SpacerProto spacers = 5;
  int64 revision = 6;
  repeated TileCommitReceiptProto receipts = 7;
  repeated TileRemovalRecordProto removed_tiles = 8;
  repeated string recovery_notes = 9;
}

message TilePlacementProto {
  string tile_id = 1;
  string entry_id = 2;
  string size = 3;
  reserved 4, 5;
  int64 rank = 6;
  string group_id = 7;
  int32 preferred_column = 8;
  int32 preferred_row = 9;
  bool has_preferred_cell = 10;
  TileBindingProto binding = 11;
  TilePresentationProto presentation = 12;
  int64 revision = 13;
}

message SpacerProto {
  string spacer_id = 1;
  string size = 2;
  int64 rank = 3;
  string group_id = 4;
  int32 preferred_column = 5;
  int32 preferred_row = 6;
  bool has_preferred_cell = 7;
}

message LauncherRecoveryProto {
  int32 startup_attempt_count = 1;
  bool launch_pending = 2;
  int64 last_launch_epoch_millis = 3;
  bool safe_mode = 4;
}

message TileBindingProto {
  string provider_id = 1;
  string kind = 2;
  string content_id = 3;
}
message TilePresentationProto {
  string style = 1;
  string legacy_mode = 2;
  bool rotate = 3;
  bool has_rotate = 4;
  int32 interval_seconds = 5;
  int32 history_minutes = 6;
  double range_minimum = 7;
  double range_maximum = 8;
  bool has_fixed_range = 9;
  bool hide_source = 10;
  bool hide_reference = 11;
}
message TileCommitReceiptProto {
  string request_id = 1;
  string tile_id = 2;
  int64 revision = 3;
  int64 document_revision = 4;
  string operation = 5;
  bool relocated = 6;
}
message TileRemovalRecordProto {
  string request_id = 1;
  TilePlacementProto entry = 2;
  int64 document_revision = 3;
}
