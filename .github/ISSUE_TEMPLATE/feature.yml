name: Yokuli OS feature slice
description: Define a marine outcome using the canonical WP8 UI and TDD contract.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Start with the marine outcome. UI must follow `docs/WP8_UI_PATTERN.md`; safety semantics override decorative motion.
  - type: textarea
    id: outcome
    attributes:
      label: Marine user outcome
      description: What can the user safely accomplish after this slice?
      placeholder: A sailor can...
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owning core app
      options: [Chart, Cockpit, Library, System, Shell]
    validations:
      required: true
  - type: dropdown
    id: navigation
    attributes:
      label: Navigation depth
      description: This selects the standard motion family.
      options: [Sibling, Deeper, Context-carrying, Transient, Safety interrupt]
    validations:
      required: true
  - type: input
    id: identity
    attributes:
      label: Page identity
      description: Large app title followed by its secondary mode/section.
      placeholder: chart / ANCHOR
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Given / When / Then / Must not
      placeholder: |
        Given ...
        When ...
        Then ...
        Must not ...
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety and data-state semantics
      description: Cover stale, held, off, conflict, alarm, resource ownership, and forbidden side effects as applicable.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: First Red test and real-Activity story
      description: Name the smallest JVM contract and the user path that will prove it in the real ShellActivity.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Delivery acknowledgement
      options:
        - label: I will update the requirement, TDD log, changelog, and verification state.
          required: true
        - label: I will not claim hardware or vessel verification from emulator evidence.
          required: true
