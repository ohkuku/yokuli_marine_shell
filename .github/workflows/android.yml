name: Yokuli OS Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

jobs:
  build:
    name: TDD contract, unit, lint, and in-app Shell APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements/stage0-schema.txt
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned Draft 2020-12 schema validator
        run: python3 -m pip install --requirement .github/requirements/stage0-schema.txt
      - name: CI helper unit tests
        id: ci_helpers
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh ci-helpers -- python3 -m unittest discover .github/scripts 'test_*.py'
      - name: Launcher Stage 0 reference contract
        id: launcher_stage0_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage0-contract -- python3 .github/scripts/test_launcher_stage0_contract.py
      - name: NMEA Sources P0 implementation baseline contract
        id: nmea_sources_p0_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p0-contract -- python3 .github/scripts/test_nmea_sources_p0_contract.py
      - name: NMEA Sources P1 pure data contract
        id: nmea_sources_p1_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p1-contract -- python3 .github/scripts/test_nmea_sources_p1_contract.py
      - name: NMEA Sources P2 real input runtime contract
        id: nmea_sources_p2_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p2-contract -- python3 .github/scripts/test_nmea_sources_p2_contract.py
      - name: NMEA Sources P3 unified source-selection contract
        id: nmea_sources_p3_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p3-contract -- python3 .github/scripts/test_nmea_sources_p3_contract.py
      - name: NMEA Sources P4 Data Sources application contract
        id: nmea_sources_p4_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p4-contract -- python3 .github/scripts/test_nmea_sources_p4_contract.py
      - name: NMEA Sources P5 Shell installation contract
        id: nmea_sources_p5_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p5-contract -- python3 .github/scripts/test_nmea_sources_p5_contract.py
      - name: NMEA Sources P6 cross-app and lifecycle contract
        id: nmea_sources_p6_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p6-contract -- python3 .github/scripts/test_nmea_sources_p6_contract.py
      - name: NMEA Sources P7 final delivery contract
        id: nmea_sources_p7_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p7-contract -- python3 .github/scripts/test_nmea_sources_p7_contract.py
      - name: Release metadata contract
        id: release_metadata
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh release-metadata -- bash .github/scripts/test-resolve-release-metadata.sh
      - name: Workflow topology contract
        id: ci_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh ci-contract -- bash .github/scripts/test-ci-contract.sh
      - name: Encrypted secrets workflow contract
        id: secrets_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh secrets-contract -- bash .github/scripts/test-secrets-manager.sh
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        timeout-minutes: 20
        run: bash .github/scripts/run_ci_capture.sh unit-tests -- ./gradlew --no-daemon test --stacktrace
      - name: Android lint
        id: lint
        continue-on-error: true
        timeout-minutes: 15
        run: bash .github/scripts/run_ci_capture.sh lint -- ./gradlew --no-daemon lintStandaloneDebug --stacktrace
      - name: Assemble standalone debug and release-audit APKs
        id: assemble
        continue-on-error: true
        timeout-minutes: 15
        run: bash .github/scripts/run_ci_capture.sh assemble -- ./gradlew --no-daemon assembleStandaloneDebug assembleStandaloneRelease --stacktrace
      - name: Emit secret-free Google Maps build configuration evidence
        id: google_maps_evidence
        continue-on-error: true
        run: >-
          bash .github/scripts/run_ci_capture.sh google-maps-evidence --
          python3 .github/scripts/emit_google_maps_configuration_evidence.py
          --build-root app-shell/build
          --output build/google-maps/configuration.json
      - name: Launcher Stage 1 product-surface contract
        id: launcher_stage1_contract
        continue-on-error: true
        run: >-
          bash .github/scripts/run_ci_capture.sh launcher-stage1-contract -- bash -c
          'python3 .github/scripts/test_launcher_stage1_contract.py && bash .github/scripts/test-release-product-surface.sh'
      - name: Launcher Stage 2 engine-boundary contract
        id: launcher_stage2_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage2-contract -- python3 .github/scripts/test_launcher_stage2_contract.py
      - name: Launcher Stage 2.5 WP8 reference-evidence contract
        id: launcher_stage25_contract
        continue-on-error: true
        run: >-
          bash .github/scripts/run_ci_capture.sh launcher-stage25-contract -- bash -c
          'python3 .github/scripts/test_launcher_stage25_contract.py && python3 .github/scripts/validate_wp8_reference.py --require-human-review'
      - name: Launcher Stage 3 geometry and Start-document contract
        id: launcher_stage3_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage3-contract -- python3 .github/scripts/test_launcher_stage3_contract.py
      - name: Launcher Stage 4 deterministic Engine-state contract
        id: launcher_stage4_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage4-contract -- python3 .github/scripts/test_launcher_stage4_contract.py
      - name: Launcher Stage 5 interactive-pager contract
        id: launcher_stage5_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage5-contract -- python3 .github/scripts/test_launcher_stage5_contract.py
      - name: Launcher Stage 6 spatial-grid contract
        id: launcher_stage6_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage6-contract -- python3 .github/scripts/test_launcher_stage6_contract.py
      - name: Launcher Stage 7 complete-edit contract
        id: launcher_stage7_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage7-contract -- python3 .github/scripts/test_launcher_stage7_contract.py
      - name: Launcher Stage 8 pin/unpin contract
        id: launcher_stage8_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage8-contract -- python3 .github/scripts/test_launcher_stage8_contract.py
      - name: Launcher Stage 9 navigation and virtual-key contract
        id: launcher_stage9_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage9-contract -- python3 .github/scripts/test_launcher_stage9_contract.py
      - name: Launcher Stage 10 durable-restore and recovery contract
        id: launcher_stage10_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage10-contract -- python3 .github/scripts/test_launcher_stage10_contract.py
      - name: Launcher Stage 11 performance and fidelity candidate contract
        id: launcher_stage11_contract
        continue-on-error: true
        run: >-
          bash .github/scripts/run_ci_capture.sh launcher-stage11-contract -- bash -c
          'python3 .github/scripts/test_launcher_stage11_contract.py && python3 .github/scripts/validate_stage11_fidelity.py'
      - name: Shell-App tile installation contract
        id: shell_app_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh shell-app-contract -- python3 .github/scripts/test_shell_app_contract.py
      - name: Chart C12 cumulative delivery contract
        id: chart_c12_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh chart-c12-contract -- python3 .github/scripts/test_chart_c12_contract.py
      - name: Chart Library CL07 independent application contract
        id: chart_library_cl07_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh chart-library-cl07-contract -- python3 .github/scripts/test_chart_library_cl07_contract.py
      - name: Chart Library CL08 display plan and coverage contract
        id: chart_library_cl08_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh chart-library-cl08-contract -- python3 .github/scripts/test_chart_library_cl08_contract.py
      - name: Chart Library CL09 managed migration and copy contract
        id: chart_library_cl09_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh chart-library-cl09-contract -- python3 .github/scripts/test_chart_library_cl09_contract.py
      - name: Chart Library CL10 Shell installation and linked navigation contract
        id: chart_library_cl10_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh chart-library-cl10-contract -- python3 .github/scripts/test_chart_library_cl10_contract.py
      - name: Chart Library CL11 resilience and bounded-resource contract
        id: chart_library_cl11_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh chart-library-cl11-contract -- python3 .github/scripts/test_chart_library_cl11_contract.py
      - name: Chart Library CL12 final product and evidence contract
        id: chart_library_cl12_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh chart-library-cl12-contract -- python3 .github/scripts/test_chart_library_cl12_contract.py
      - name: OS Redesign W01 app-model and migration contract
        id: osr_w01_only_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w01-contract -- python3 .github/scripts/test_osr_w01_contract.py
      - name: OS Redesign W02 live UI foundation contract
        id: osr_w02_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w02-contract -- python3 .github/scripts/test_osr_w02_contract.py
      - name: OS Redesign W03 Data domain merge contract
        id: osr_w03_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w03-contract -- python3 .github/scripts/test_osr_w03_contract.py
      - name: OS Redesign W04 complete Data vertical-slice contract
        id: osr_w04_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w04-contract -- python3 .github/scripts/test_osr_w04_contract.py
      - name: OS Redesign W08 Google Satellite and owned-overlay contract
        id: osr_w08_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w08-contract -- python3 .github/scripts/test_osr_w08_contract.py
      - name: OS Redesign W09 focused Chart and Quick Layers contract
        id: osr_w09_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w09-contract -- python3 .github/scripts/test_osr_w09_contract.py
      - name: OS Redesign W10 Navigation domain migration contract
        id: osr_w10_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w10-contract -- python3 .github/scripts/test_osr_w10_contract.py
      - name: OS Redesign cumulative contract enforcement
        id: osr_w01_contract
        if: always()
        continue-on-error: true
        env:
          OSR_W01_ONLY_RESULT: ${{ steps.osr_w01_only_contract.outcome }}
          OSR_W02_RESULT: ${{ steps.osr_w02_contract.outcome }}
          OSR_W03_RESULT: ${{ steps.osr_w03_contract.outcome }}
          OSR_W04_RESULT: ${{ steps.osr_w04_contract.outcome }}
          OSR_W08_RESULT: ${{ steps.osr_w08_contract.outcome }}
          OSR_W09_RESULT: ${{ steps.osr_w09_contract.outcome }}
          OSR_W10_RESULT: ${{ steps.osr_w10_contract.outcome }}
        run: |
          test "$OSR_W01_ONLY_RESULT" = success
          test "$OSR_W02_RESULT" = success
          test "$OSR_W03_RESULT" = success
          test "$OSR_W04_RESULT" = success
          test "$OSR_W08_RESULT" = success
          test "$OSR_W09_RESULT" = success
          test "$OSR_W10_RESULT" = success
      - name: Upload quality-gate candidate APKs
        if: steps.ci_helpers.outcome == 'success' && steps.launcher_stage0_contract.outcome == 'success' && steps.nmea_sources_p0_contract.outcome == 'success' && steps.nmea_sources_p1_contract.outcome == 'success' && steps.nmea_sources_p2_contract.outcome == 'success' && steps.nmea_sources_p3_contract.outcome == 'success' && steps.nmea_sources_p4_contract.outcome == 'success' && steps.nmea_sources_p5_contract.outcome == 'success' && steps.nmea_sources_p6_contract.outcome == 'success' && steps.nmea_sources_p7_contract.outcome == 'success' && steps.launcher_stage1_contract.outcome == 'success' && steps.launcher_stage2_contract.outcome == 'success' && steps.launcher_stage25_contract.outcome == 'success' && steps.launcher_stage3_contract.outcome == 'success' && steps.launcher_stage4_contract.outcome == 'success' && steps.launcher_stage5_contract.outcome == 'success' && steps.launcher_stage6_contract.outcome == 'success' && steps.launcher_stage7_contract.outcome == 'success' && steps.launcher_stage8_contract.outcome == 'success' && steps.launcher_stage9_contract.outcome == 'success' && steps.launcher_stage10_contract.outcome == 'success' && steps.launcher_stage11_contract.outcome == 'success' && steps.shell_app_contract.outcome == 'success' && steps.chart_c12_contract.outcome == 'success' && steps.chart_library_cl07_contract.outcome == 'success' && steps.chart_library_cl08_contract.outcome == 'success' && steps.chart_library_cl09_contract.outcome == 'success' && steps.chart_library_cl10_contract.outcome == 'success' && steps.chart_library_cl11_contract.outcome == 'success' && steps.chart_library_cl12_contract.outcome == 'success' && steps.osr_w01_contract.outcome == 'success' && steps.google_maps_evidence.outcome == 'success' && steps.release_metadata.outcome == 'success' && steps.ci_contract.outcome == 'success' && steps.secrets_contract.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.lint.outcome == 'success' && steps.assemble.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-debug-candidate-${{ github.sha }}
          path: |
            app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload explicitly unverified diagnostic APKs
        if: steps.assemble.outcome == 'success' && (steps.ci_helpers.outcome != 'success' || steps.launcher_stage0_contract.outcome != 'success' || steps.nmea_sources_p0_contract.outcome != 'success' || steps.nmea_sources_p1_contract.outcome != 'success' || steps.nmea_sources_p2_contract.outcome != 'success' || steps.nmea_sources_p3_contract.outcome != 'success' || steps.nmea_sources_p4_contract.outcome != 'success' || steps.nmea_sources_p5_contract.outcome != 'success' || steps.nmea_sources_p6_contract.outcome != 'success' || steps.nmea_sources_p7_contract.outcome != 'success' || steps.launcher_stage1_contract.outcome != 'success' || steps.launcher_stage2_contract.outcome != 'success' || steps.launcher_stage25_contract.outcome != 'success' || steps.launcher_stage3_contract.outcome != 'success' || steps.launcher_stage4_contract.outcome != 'success' || steps.launcher_stage5_contract.outcome != 'success' || steps.launcher_stage6_contract.outcome != 'success' || steps.launcher_stage7_contract.outcome != 'success' || steps.launcher_stage8_contract.outcome != 'success' || steps.launcher_stage9_contract.outcome != 'success' || steps.launcher_stage10_contract.outcome != 'success' || steps.launcher_stage11_contract.outcome != 'success' || steps.shell_app_contract.outcome != 'success' || steps.chart_c12_contract.outcome != 'success' || steps.chart_library_cl07_contract.outcome != 'success' || steps.chart_library_cl08_contract.outcome != 'success' || steps.chart_library_cl09_contract.outcome != 'success' || steps.chart_library_cl10_contract.outcome != 'success' || steps.chart_library_cl11_contract.outcome != 'success' || steps.chart_library_cl12_contract.outcome != 'success' || steps.osr_w01_contract.outcome != 'success' || steps.google_maps_evidence.outcome != 'success' || steps.release_metadata.outcome != 'success' || steps.ci_contract.outcome != 'success' || steps.secrets_contract.outcome != 'success' || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-yokuli-os-debug-${{ github.sha }}
          path: |
            app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload CL10 diagnostic APK when its product contract fails
        if: steps.assemble.outcome == 'success' && steps.chart_library_cl10_contract.outcome != 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-CL10-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload CL11 diagnostic APK when its resilience contract fails
        if: steps.assemble.outcome == 'success' && steps.chart_library_cl11_contract.outcome != 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-CL11-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload CL12 diagnostic APK when its final contract fails
        if: steps.assemble.outcome == 'success' && (steps.chart_library_cl12_contract.outcome != 'success' || steps.google_maps_evidence.outcome != 'success') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-CL12-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload W01 diagnostic APK when its product migration contract fails
        if: steps.assemble.outcome == 'success' && steps.osr_w01_only_contract.outcome != 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-W01-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload W02 diagnostic APK when its live UI contract fails
        if: steps.assemble.outcome == 'success' && steps.osr_w02_contract.outcome != 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-W02-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload W03 diagnostic APK when its Data domain contract fails
        if: steps.assemble.outcome == 'success' && steps.osr_w03_contract.outcome != 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-W03-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload W04 diagnostic APK when its Data vertical-slice contract fails
        if: steps.assemble.outcome == 'success' && steps.osr_w04_contract.outcome != 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-W04-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload W08 diagnostic APK when its connected-map contract fails
        if: steps.assemble.outcome == 'success' && steps.osr_w08_contract.outcome != 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-W08-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload W09 diagnostic APK when its focused-Chart contract fails
        if: steps.assemble.outcome == 'success' && steps.osr_w09_contract.outcome != 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-W09-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload W10 diagnostic APK when its Navigation-domain contract fails
        if: steps.assemble.outcome == 'success' && steps.osr_w10_contract.outcome != 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-W10-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit-test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-build-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            build/google-maps/configuration.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build gate summary and annotations
        if: always()
        run: >-
          python3 .github/scripts/write_job_summary.py "Build quality gate"
          "CI helper tests=${{ steps.ci_helpers.outcome }}"
          "Launcher Stage 0 contract=${{ steps.launcher_stage0_contract.outcome }}"
          "NMEA Sources P0 baseline=${{ steps.nmea_sources_p0_contract.outcome }}"
          "NMEA Sources P1 pure data=${{ steps.nmea_sources_p1_contract.outcome }}"
          "NMEA Sources P2 real input runtime=${{ steps.nmea_sources_p2_contract.outcome }}"
          "NMEA Sources P3 unified source selection=${{ steps.nmea_sources_p3_contract.outcome }}"
          "NMEA Sources P4 Data Sources app=${{ steps.nmea_sources_p4_contract.outcome }}"
          "NMEA Sources P5 Shell installation=${{ steps.nmea_sources_p5_contract.outcome }}"
          "NMEA Sources P6 lifecycle evidence=${{ steps.nmea_sources_p6_contract.outcome }}"
          "NMEA Sources P7 final delivery=${{ steps.nmea_sources_p7_contract.outcome }}"
