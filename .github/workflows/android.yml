name: Yokuli OS Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      final_gate:
        description: Run the current Product Recovery machine gate; human acceptance remains separate
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}

jobs:
  human-test-apk:
    name: Build downloadable human-test APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Assemble the installable debug APK without waiting for test gates
        run: ./gradlew --no-daemon assembleStandaloneDebug --stacktrace
      - name: Report key configuration without exposing credentials
        run: |
          if [ -n "${GOOGLE_MAPS_ANDROID_API_KEY:-}" ]; then
            echo 'Google Maps key configured: yes (authorisation still requires a device check).' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Google Maps key configured: no (local charts and OpenStreetMap remain available).' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Experience build: ready for human review; historical test gates are intentionally deferred.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the one installable debug APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: YOKULI-OS-DEBUG-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  build:
    name: TDD contract, unit, lint, and in-app Shell APKs
    if: false # EXPERIENCE_REBUILD: owner requested manual experience review before restoring engineering gates.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements/stage0-schema.txt
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned Draft 2020-12 schema validator
        run: python3 -m pip install --requirement .github/requirements/stage0-schema.txt
      - name: CI helper unit tests
        id: ci_helpers
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh ci-helpers -- bash .github/scripts/run_ci_helper_tests.sh
      - name: Launcher Stage 0 reference contract
        id: launcher_stage0_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage0-contract -- python3 .github/scripts/test_launcher_stage0_contract.py
      - name: NMEA Sources P0 implementation baseline contract
        id: nmea_sources_p0_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p0-contract -- python3 .github/scripts/test_nmea_sources_p0_contract.py
      - name: NMEA Sources P1 pure data contract
        id: nmea_sources_p1_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p1-contract -- python3 .github/scripts/test_nmea_sources_p1_contract.py
      - name: NMEA Sources P2 real input runtime contract
        id: nmea_sources_p2_contract
        if: false # PRODUCT_RECOVERY: mixed runtime/UI source-inspection contract; runtime behavior remains gated.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p2-contract -- python3 .github/scripts/test_nmea_sources_p2_contract.py
      - name: NMEA Sources P3 unified source-selection contract
        id: nmea_sources_p3_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p3-contract -- python3 .github/scripts/test_nmea_sources_p3_contract.py
      - name: NMEA Sources P4 Data Sources application contract
        id: nmea_sources_p4_contract
        if: false # PRODUCT_RECOVERY: rejected presentation contract retained only as history.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p4-contract -- python3 .github/scripts/test_nmea_sources_p4_contract.py
      - name: NMEA Sources P5 Shell installation contract
        id: nmea_sources_p5_contract
        if: false # PRODUCT_RECOVERY: superseded standalone-App presentation contract.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p5-contract -- python3 .github/scripts/test_nmea_sources_p5_contract.py
      - name: NMEA Sources P6 cross-app and lifecycle contract
        id: nmea_sources_p6_contract
        if: false # PRODUCT_RECOVERY: mixed UI story contract; lifecycle and cross-App behavior run directly.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p6-contract -- python3 .github/scripts/test_nmea_sources_p6_contract.py
      - name: NMEA Sources P7 final delivery contract
        id: nmea_sources_p7_contract
        if: false # PRODUCT_RECOVERY: old product-completion claims are not authoritative.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh nmea-sources-p7-contract -- python3 .github/scripts/test_nmea_sources_p7_contract.py
      - name: Release metadata contract
        id: release_metadata
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh release-metadata -- bash .github/scripts/test-resolve-release-metadata.sh
      - name: Workflow topology contract
        id: ci_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh ci-contract -- bash .github/scripts/test-ci-contract.sh
      - name: Product Recovery Window test-authority contract
        id: product_recovery_policy
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh product-recovery-policy -- python3 .github/scripts/test_product_recovery_window.py
      - name: Legacy known-good MBTiles compatibility contract
        id: legacy_mbtiles_compatibility
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh legacy-mbtiles-compatibility -- python3 .github/scripts/test_legacy_mbtiles_compatibility.py
      - name: Encrypted secrets workflow contract
        id: secrets_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh secrets-contract -- bash .github/scripts/test-secrets-manager.sh
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        timeout-minutes: 20
        run: bash .github/scripts/run_ci_capture.sh unit-tests -- bash .github/scripts/run_product_recovery_unit_tests.sh
      - name: Android lint
        id: lint
        continue-on-error: true
        timeout-minutes: 15
        run: bash .github/scripts/run_ci_capture.sh lint -- ./gradlew --no-daemon lintStandaloneDebug --stacktrace
      - name: Assemble standalone debug and release-audit APKs
        id: assemble
        continue-on-error: true
        timeout-minutes: 15
        run: bash .github/scripts/run_ci_capture.sh assemble -- ./gradlew --no-daemon assembleStandaloneDebug assembleStandaloneRelease --stacktrace
      - name: Emit secret-free Google Maps build configuration evidence
        id: google_maps_evidence
        continue-on-error: true
        run: |
          maps_args=()
          if [ '${{ github.event_name }}' != pull_request ]; then maps_args+=(--require-configured); fi
          bash .github/scripts/run_ci_capture.sh google-maps-evidence -- \
            python3 .github/scripts/emit_google_maps_configuration_evidence.py \
            --build-root app-shell/build \
            --output build/google-maps/configuration.json \
            "${maps_args[@]}"
      - name: Release manifest and forbidden-code surface audit
        id: release_surface_audit
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh release-surface-audit -- bash .github/scripts/test-release-product-surface.sh
      - name: Launcher Stage 1 product-surface contract
        id: launcher_stage1_contract
        if: false # PRODUCT_RECOVERY: old exact App/UI strings are not authoritative.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage1-contract -- python3 .github/scripts/test_launcher_stage1_contract.py
      - name: Launcher Stage 2 engine-boundary contract
        id: launcher_stage2_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage2-contract -- python3 .github/scripts/test_launcher_stage2_contract.py
      - name: Launcher Stage 2.5 WP8 reference-evidence contract
        id: launcher_stage25_contract
        continue-on-error: true
        run: >-
          bash .github/scripts/run_ci_capture.sh launcher-stage25-contract -- bash -c
          'python3 .github/scripts/test_launcher_stage25_contract.py && python3 .github/scripts/validate_wp8_reference.py --require-human-review'
      - name: Launcher Stage 3 geometry and Start-document contract
        id: launcher_stage3_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage3-contract -- python3 .github/scripts/test_launcher_stage3_contract.py
      - name: Launcher Stage 4 deterministic Engine-state contract
        id: launcher_stage4_contract
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage4-contract -- python3 .github/scripts/test_launcher_stage4_contract.py
      - name: Launcher Stage 5 interactive-pager contract
        id: launcher_stage5_contract
        if: false # PRODUCT_RECOVERY: implementation-specific presentation inspection is retired.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage5-contract -- python3 .github/scripts/test_launcher_stage5_contract.py
      - name: Launcher Stage 6 spatial-grid contract
        id: launcher_stage6_contract
        if: false # PRODUCT_RECOVERY: core spatial behavior stays gated; concrete Composable inspection does not.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh launcher-stage6-contract -- python3 .github/scripts/test_launcher_stage6_contract.py
