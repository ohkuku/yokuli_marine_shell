name: Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit, lint, and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify and assemble both shell modes
        run: ./gradlew test lintStandaloneDebug assembleStandaloneDebug assembleHomeDebug
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: yokuli-os-debug-apks
          path: app-shell/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-reports
          path: "**/build/reports/**"
          if-no-files-found: ignore

  integration:
    name: Shell stories on API 34
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run real-activity Compose stories
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: ./gradlew :app-shell:connectedStandaloneDebugAndroidTest
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-integration-reports
          path: app-shell/build/reports/androidTests/**
          if-no-files-found: ignore
