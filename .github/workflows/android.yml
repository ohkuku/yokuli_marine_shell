          "Launcher Stage 2 engine boundary=${{ steps.launcher_stage2_contract.outcome }}"
          "Launcher Stage 2.5 WP8 reference evidence=${{ steps.launcher_stage25_contract.outcome }}"
          "Launcher Stage 3 geometry and Start document=${{ steps.launcher_stage3_contract.outcome }}"
          "Launcher Stage 4 deterministic Engine state=${{ steps.launcher_stage4_contract.outcome }}"
          "Launcher Stage 5 interactive pager=${{ steps.launcher_stage5_contract.outcome }}"
          "Launcher Stage 6 spatial grid=${{ steps.launcher_stage6_contract.outcome }}"
          "Launcher Stage 7 complete edit=${{ steps.launcher_stage7_contract.outcome }}"
          "Launcher Stage 8 pin and unpin=${{ steps.launcher_stage8_contract.outcome }}"
          "Launcher Stage 9 navigation and virtual keys=${{ steps.launcher_stage9_contract.outcome }}"
          "Launcher Stage 10 durable restore and recovery=${{ steps.launcher_stage10_contract.outcome }}"
          "Launcher Stage 11 performance and fidelity candidates=${{ steps.launcher_stage11_contract.outcome }}"
          "Shell-App tile installation contract=${{ steps.shell_app_contract.outcome }}"
          "Chart C12 cumulative delivery=${{ steps.chart_c12_contract.outcome }}"
          "Chart Library CL07 independent application=${{ steps.chart_library_cl07_contract.outcome }}"
          "Chart Library CL08 display plan and coverage=${{ steps.chart_library_cl08_contract.outcome }}"
          "Chart Library CL09 managed migration and copy=${{ steps.chart_library_cl09_contract.outcome }}"
          "Chart Library CL10 Shell installation and linked navigation=${{ steps.chart_library_cl10_contract.outcome }}"
          "Chart Library CL11 resilience and bounded resources=${{ steps.chart_library_cl11_contract.outcome }}"
          "Chart Library CL12 final product and evidence=${{ steps.chart_library_cl12_contract.outcome }}"
          "OS Redesign W01 app model and migration=${{ steps.osr_w01_only_contract.outcome }}"
          "OS Redesign W02 live UI foundation=${{ steps.osr_w02_contract.outcome }}"
          "OS Redesign W03 Data domain merge=${{ steps.osr_w03_contract.outcome }}"
          "OS Redesign W04 complete Data vertical slice=${{ steps.osr_w04_contract.outcome }}"
          "OS Redesign W08 connected base and owned overlays=${{ steps.osr_w08_contract.outcome }}"
          "OS Redesign W09 focused Chart and Quick Layers=${{ steps.osr_w09_contract.outcome }}"
          "OS Redesign W10 Navigation domain migration=${{ steps.osr_w10_contract.outcome }}"
          "OS Redesign W11 active navigation runtime=${{ steps.osr_w11_contract.outcome }}"
          "OS Redesign W12 Navigation app=${{ steps.osr_w12_contract.outcome }}"
          "OS Redesign W13 Preferences=${{ steps.osr_w13_contract.outcome }}"
          "OS Redesign W14 bounded live tiles=${{ steps.osr_w14_contract.outcome }}"
          "OS Redesign W15 product-surface removal=${{ steps.osr_w15_contract.outcome }}"
          "OS Redesign W16 final evidence contract=${{ steps.osr_w16_contract.outcome }}"
          "OS Redesign W16 build evidence=${{ steps.osr_w16_build_evidence.outcome }}"
          "OS Redesign cumulative enforcement=${{ steps.osr_w01_contract.outcome }}"
