        run: echo "sha12=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Download this run's bounded per-job reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: CODEX-JOB-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/codex-ci/downloaded-jobs
      - name: Compose commit-bound unified report
        if: always()
        run: >-
          python3 .github/scripts/compose_codex_ci_report.py
          --input build/codex-ci/downloaded-jobs
          --output build/codex-ci/unified-report
          --repository '${{ github.repository }}'
          --workflow '${{ github.workflow }}'
          --head-sha '${{ github.sha }}'
          --branch '${{ github.head_ref || github.ref_name }}'
          --run-id '${{ github.run_id }}'
          --run-attempt '${{ github.run_attempt }}'
          --event-name '${{ github.event_name }}'
          --job-result 'build=${{ needs.build.result }}'
          --job-result 'api34=${{ needs.integration.result }}'
          --job-result 'api36=${{ needs.api-compatibility.result }}'
          --job-result 'performance=${{ needs.stage11-performance.result }}'
      - name: Upload the one report used for Codex repair
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CODEX-CI-REPORT-${{ steps.codex_identity.outputs.sha12 }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/codex-ci/unified-report
          if-no-files-found: error
          retention-days: 30

  verified-debug:
    name: Publish automation-passed Product Recovery APK
    needs: [human-test-apk, build, integration, api-compatibility, stage11-performance]
    if: false # Do not label a manual-experience build as automation-passed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download the exact human-test APK with digest verification
        uses: actions/download-artifact@v8
        with:
          name: YOKULI-OS-DEBUG-${{ github.sha }}
          path: verified-apk
      - name: Product Recovery artifact summary
        run: |
          {
            echo '## Yokuli OS Product Recovery APK — human acceptance pending'
            echo 'Protected domain/runtime tests, lint, build, API suites and cold/warm startup signals passed. Rejected presentation tests are deliberately not authoritative during the recovery window.'
            echo 'Download: **YOKULI-OS-DEBUG-${{ github.sha }}**'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect verified-artifact failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh verified-debug
      - name: Upload downloadable verified-artifact failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-verified-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/verified-debug
          if-no-files-found: error
          retention-days: 30
