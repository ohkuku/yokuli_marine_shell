  integration:
    name: Chart MBTiles, Room, and WP8 Shell on API 34
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: Run MBTiles + Room + Shell device suites with motion enabled
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            bash .github/scripts/run_device_tests.sh all
            bash .github/scripts/run_c12_process_restore.sh
            bash .github/scripts/run_nmea_sources_process_restore.sh
      - name: Expose instrumented test failures
        if: failure()
        run: |
          python3 .github/scripts/report_android_test_failures.py \
            --result-root app-shell/build/outputs/androidTest-results \
            --result-root adapter/marine-data-android/build/outputs/androidTest-results \
            --result-root adapter/map-offline/build/outputs/androidTest-results \
            --result-root adapter/map-storage/build/outputs/androidTest-results \
            --result-root feature/chart-library/build/outputs/androidTest-results
      - name: Extract Chart Library CL11 resource evidence
        if: always()
        run: >-
          python3 .github/scripts/extract_chart_library_cl11_evidence.py
          --root .
          --output build/chart-library-cl11/evidence.json
          --require-complete
      - name: Device-test summary
        if: always()
        run: python3 .github/scripts/write_job_summary.py "API 34 real-Activity stories" "Instrumented tests=${{ job.status }}"
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-api34-reports-${{ github.sha }}
          path: |
            app-shell/build/reports/androidTests/**
            app-shell/build/outputs/androidTest-results/**
            adapter/marine-data-android/build/reports/androidTests/**
            adapter/marine-data-android/build/outputs/androidTest-results/**
            adapter/map-offline/build/reports/androidTests/**
            adapter/map-offline/build/outputs/androidTest-results/**
            adapter/map-storage/build/reports/androidTests/**
            adapter/map-storage/build/outputs/androidTest-results/**
            feature/chart-library/build/reports/androidTests/**
            feature/chart-library/build/outputs/androidTest-results/**
            build/ci-device-tests.log
            build/ci-c12-process-restore.log
            build/ci-nmea-sources-process-restore.log
            build/chart-library-cl11/evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Collect integration failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh integration-api34
      - name: Upload downloadable integration failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-integration-api34-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/integration-api34
          if-no-files-found: error
          retention-days: 30
      - name: Compute Codex report artifact identity
        if: always()
        id: codex_identity
        run: echo "sha12=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Build bounded Codex API 34 job report
        if: always()
        run: >-
          python3 .github/scripts/build_codex_job_report.py
          --job api34
          --status '${{ job.status }}'
          --head-sha '${{ github.sha }}'
          --output build/codex-ci/job-report
      - name: Upload Codex API 34 job report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CODEX-JOB-api34-${{ steps.codex_identity.outputs.sha12 }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/codex-ci/job-report
          if-no-files-found: error
          retention-days: 30

