name: Yokuli OS Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TDD contract, unit, lint, and dual APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: CI helper unit tests
        id: ci_helpers
        continue-on-error: true
        run: python3 -m unittest discover .github/scripts 'test_*.py'
      - name: Release metadata contract
        id: release_metadata
        continue-on-error: true
        run: bash .github/scripts/test-resolve-release-metadata.sh
      - name: Workflow topology contract
        id: ci_contract
        continue-on-error: true
        run: bash .github/scripts/test-ci-contract.sh
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        timeout-minutes: 20
        run: ./gradlew --no-daemon test --stacktrace
      - name: Android lint
        id: lint
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew --no-daemon lintStandaloneDebug --stacktrace
      - name: Assemble standalone and HOME debug APKs
        id: assemble
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew --no-daemon assembleStandaloneDebug assembleHomeDebug --stacktrace
      - name: Upload quality-gate candidate APKs
        if: steps.ci_helpers.outcome == 'success' && steps.release_metadata.outcome == 'success' && steps.ci_contract.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.lint.outcome == 'success' && steps.assemble.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-debug-candidate-${{ github.sha }}
          path: app-shell/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload explicitly unverified diagnostic APKs
        if: steps.assemble.outcome == 'success' && (steps.ci_helpers.outcome != 'success' || steps.release_metadata.outcome != 'success' || steps.ci_contract.outcome != 'success' || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit-test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-build-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Build gate summary and annotations
        if: always()
        run: >-
          python3 .github/scripts/write_job_summary.py "Build quality gate"
          "CI helper tests=${{ steps.ci_helpers.outcome }}"
          "Release metadata=${{ steps.release_metadata.outcome }}"
          "Workflow contract=${{ steps.ci_contract.outcome }}"
          "Unit tests=${{ steps.unit_tests.outcome }}"
          "Android lint=${{ steps.lint.outcome }}"
          "Dual APK compile=${{ steps.assemble.outcome }}"
      - name: Collect build failure diagnostics
        if: always() && (failure() || steps.ci_helpers.outcome != 'success' || steps.release_metadata.outcome != 'success' || steps.ci_contract.outcome != 'success' || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success' || steps.assemble.outcome != 'success')
        run: bash .github/scripts/collect_failure_bundle.sh build
      - name: Upload downloadable build failure bundle
        if: always() && (failure() || steps.ci_helpers.outcome != 'success' || steps.release_metadata.outcome != 'success' || steps.ci_contract.outcome != 'success' || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success' || steps.assemble.outcome != 'success')
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/build
          if-no-files-found: error
          retention-days: 30
      - name: Enforce build quality gate
        if: always()
        env:
          CI_HELPERS_RESULT: ${{ steps.ci_helpers.outcome }}
          RELEASE_METADATA_RESULT: ${{ steps.release_metadata.outcome }}
          CI_CONTRACT_RESULT: ${{ steps.ci_contract.outcome }}
          UNIT_TEST_RESULT: ${{ steps.unit_tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
        run: |
          failed=0
          for result in CI_HELPERS_RESULT RELEASE_METADATA_RESULT CI_CONTRACT_RESULT UNIT_TEST_RESULT LINT_RESULT ASSEMBLE_RESULT; do
            if [ "${!result}" != success ]; then echo "::error title=$result failed::Open the job summary and FAILURE artifact."; failed=1; fi
          done
          exit "$failed"

  integration:
    name: WP8 shell stories on API 34
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: Run real-Activity stories with motion enabled
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            bash .github/scripts/run_device_tests.sh all
      - name: Expose instrumented test failures
        if: failure()
        run: python3 .github/scripts/report_android_test_failures.py
      - name: Device-test summary
        if: always()
        run: python3 .github/scripts/write_job_summary.py "API 34 real-Activity stories" "Instrumented tests=${{ job.status }}"
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-api34-reports-${{ github.sha }}
          path: |
            app-shell/build/reports/androidTests/**
            app-shell/build/outputs/androidTest-results/**
            build/ci-device-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Collect integration failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh integration-api34
      - name: Upload downloadable integration failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-integration-api34-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/integration-api34
          if-no-files-found: error
          retention-days: 30

  api-compatibility:
    name: Android 16 / API 36 reduced-motion smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: API 36 launch smoke with platform animation scale disabled
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            bash .github/scripts/run_device_tests.sh smoke
      - name: Expose API compatibility failures
        if: failure()
        run: python3 .github/scripts/report_android_test_failures.py
      - name: Compatibility summary
        if: always()
        run: python3 .github/scripts/write_job_summary.py "API 36 compatibility" "Reduced-motion smoke=${{ job.status }}"
      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-api36-reports-${{ github.sha }}
          path: |
            app-shell/build/reports/androidTests/**
            app-shell/build/outputs/androidTest-results/**
            build/ci-device-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Collect API compatibility failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh compatibility-api36
      - name: Upload downloadable API compatibility failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-compatibility-api36-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/compatibility-api36
          if-no-files-found: error
          retention-days: 30

  verified-debug:
    name: Publish fully verified debug APKs
    needs: [build, integration, api-compatibility]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download quality-gate candidate with digest verification
        uses: actions/download-artifact@v8
        with:
          name: yokuli-os-debug-candidate-${{ github.sha }}
          path: verified-apk
      - name: Upload fully verified installable APKs
        uses: actions/upload-artifact@v7
        with:
          name: VERIFIED-yokuli-os-debug-${{ github.sha }}
          path: verified-apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Verified artifact summary
        run: |
          {
            echo '## Fully verified Yokuli OS debug APKs'
            echo 'TDD contract, unit tests, lint, dual builds, API 34 stories, and API 36 smoke all passed.'
            echo 'Download: **VERIFIED-yokuli-os-debug-${{ github.sha }}**'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect verified-artifact failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh verified-debug
      - name: Upload downloadable verified-artifact failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-verified-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/verified-debug
          if-no-files-found: error
          retention-days: 30
