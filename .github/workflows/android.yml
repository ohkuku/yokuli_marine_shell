        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w14-contract -- python3 .github/scripts/test_osr_w14_contract.py
      - name: OS Redesign W15 legacy product-surface removal contract
        id: osr_w15_contract
        if: false # PRODUCT_RECOVERY: exact old UI reachability is not authoritative.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w15-contract -- python3 .github/scripts/test_osr_w15_contract.py
      - name: OS Redesign W16 final evidence contract
        id: osr_w16_contract
        if: false # PRODUCT_RECOVERY: no final product claim before human acceptance.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh osr-w16-contract -- python3 .github/scripts/test_osr_w16_contract.py
      - name: Chart, Navigation, and Shell UX correction contract
        id: chart_shell_ux_correction
        if: false # PRODUCT_RECOVERY: this interim static UI shape was not human-approved.
        continue-on-error: true
        run: bash .github/scripts/run_ci_capture.sh chart-shell-ux-correction -- python3 .github/scripts/test_chart_shell_ux_correction.py
      - name: Collect W16 build, migration, release-surface, soak, and Maps evidence
        id: osr_w16_build_evidence
        if: false # PRODUCT_RECOVERY: W16 final ledger is suspended until the new UX exists.
        continue-on-error: true
        run: |
          w16_args=()
          if [ '${{ github.event_name }}' = pull_request ]; then w16_args+=(--allow-unconfigured-maps); fi
          bash .github/scripts/run_ci_capture.sh w16-build-evidence -- \
            python3 .github/scripts/collect_w16_machine_evidence.py \
            --scope build \
            --output build/w16/w16-build-evidence.json \
            --migration-output build/w16/w16-migration-build.json \
            --require-complete \
            "${w16_args[@]}"
      - name: OS Redesign cumulative contract enforcement
        id: osr_w01_contract
        if: always()
        continue-on-error: true
        env:
          OSR_W01_ONLY_RESULT: ${{ steps.osr_w01_only_contract.outcome }}
          OSR_W08_RESULT: ${{ steps.osr_w08_contract.outcome }}
          OSR_W10_RESULT: ${{ steps.osr_w10_contract.outcome }}
          OSR_W11_RESULT: ${{ steps.osr_w11_contract.outcome }}
        run: |
          test "$OSR_W01_ONLY_RESULT" = success
          test "$OSR_W08_RESULT" = success
          test "$OSR_W10_RESULT" = success
          test "$OSR_W11_RESULT" = success
      - name: Upload explicitly unverified diagnostic APKs
        if: false # Product Recovery already publishes one explicitly pending artifact.
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-yokuli-os-debug-${{ github.sha }}
          path: |
            app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload CL10 diagnostic APK when its product contract fails
        if: false # PRODUCT_RECOVERY: CL10 presentation gate is retired.
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-CL10-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload CL11 diagnostic APK when its resilience contract fails
        if: false # Failure evidence belongs in reports; never duplicate the installable APK.
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-CL11-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload CL12 diagnostic APK when its final contract fails
        if: false # PRODUCT_RECOVERY: CL12 product-completion gate is retired.
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-CL12-yokuli-os-debug-${{ github.sha }}
          path: app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
