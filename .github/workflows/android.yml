  codex-report:
    name: Compose downloadable Codex repair report
    if: always()
    needs: [build, integration, api-compatibility, stage11-performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compute Codex report artifact identity
        id: codex_identity
        run: echo "sha12=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Download this run's bounded per-job reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: CODEX-JOB-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/codex-ci/downloaded-jobs
      - name: Compose commit-bound unified report
        if: always()
        run: >-
          python3 .github/scripts/compose_codex_ci_report.py
          --input build/codex-ci/downloaded-jobs
          --output build/codex-ci/unified-report
          --repository '${{ github.repository }}'
          --workflow '${{ github.workflow }}'
          --head-sha '${{ github.sha }}'
          --branch '${{ github.head_ref || github.ref_name }}'
          --run-id '${{ github.run_id }}'
          --run-attempt '${{ github.run_attempt }}'
          --job-result 'build=${{ needs.build.result }}'
          --job-result 'api34=${{ needs.integration.result }}'
          --job-result 'api36=${{ needs.api-compatibility.result }}'
          --job-result 'performance=${{ needs.stage11-performance.result }}'
      - name: Upload the one report used for Codex repair
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CODEX-CI-REPORT-${{ steps.codex_identity.outputs.sha12 }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/codex-ci/unified-report
          if-no-files-found: error
          retention-days: 30

  verified-debug:
    name: Publish fully verified alpha APK
    needs: [build, integration, api-compatibility, stage11-performance]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download quality-gate candidate with digest verification
        uses: actions/download-artifact@v8
        with:
          name: yokuli-os-debug-candidate-${{ github.sha }}
          path: verified-apk
      - name: Upload fully verified installable alpha APK
        uses: actions/upload-artifact@v7
        with:
          name: VERIFIED-yokuli-os-alpha-${{ github.sha }}
          path: verified-apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Verified artifact summary
        run: |
          {
            echo '## Fully verified Yokuli OS alpha APK'
            echo 'TDD contracts, unit tests, lint, Release audit, API 34 MBTiles + Room + Shell suites, API 36 smoke, and emulator performance journeys all passed.'
            echo 'Download: **VERIFIED-yokuli-os-alpha-${{ github.sha }}**'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect verified-artifact failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh verified-debug
      - name: Upload downloadable verified-artifact failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-verified-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/verified-debug
          if-no-files-found: error
          retention-days: 30
