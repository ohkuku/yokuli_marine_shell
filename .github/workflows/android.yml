        run: bash .github/scripts/collect_failure_bundle.sh build
      - name: Upload downloadable build failure bundle
        if: always() && (failure() || steps.product_recovery_policy.outcome != 'success' || steps.legacy_mbtiles_compatibility.outcome != 'success' || steps.ci_helpers.outcome != 'success' || steps.nmea_sources_p0_contract.outcome != 'success' || steps.nmea_sources_p1_contract.outcome != 'success' || steps.nmea_sources_p3_contract.outcome != 'success' || steps.chart_library_cl11_contract.outcome != 'success' || steps.osr_w01_contract.outcome != 'success' || steps.release_surface_audit.outcome != 'success' || steps.google_maps_evidence.outcome != 'success' || steps.release_metadata.outcome != 'success' || steps.ci_contract.outcome != 'success' || steps.secrets_contract.outcome != 'success' || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success' || steps.assemble.outcome != 'success')
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/build
          if-no-files-found: error
          retention-days: 30
      - name: Enforce build quality gate
        if: always()
        env:
          CI_HELPERS_RESULT: ${{ steps.ci_helpers.outcome }}
          LAUNCHER_STAGE0_CONTRACT_RESULT: ${{ steps.launcher_stage0_contract.outcome }}
          NMEA_SOURCES_P0_CONTRACT_RESULT: ${{ steps.nmea_sources_p0_contract.outcome }}
          NMEA_SOURCES_P1_CONTRACT_RESULT: ${{ steps.nmea_sources_p1_contract.outcome }}
          NMEA_SOURCES_P3_CONTRACT_RESULT: ${{ steps.nmea_sources_p3_contract.outcome }}
          LAUNCHER_STAGE2_CONTRACT_RESULT: ${{ steps.launcher_stage2_contract.outcome }}
          LAUNCHER_STAGE25_CONTRACT_RESULT: ${{ steps.launcher_stage25_contract.outcome }}
          LAUNCHER_STAGE3_CONTRACT_RESULT: ${{ steps.launcher_stage3_contract.outcome }}
          LAUNCHER_STAGE4_CONTRACT_RESULT: ${{ steps.launcher_stage4_contract.outcome }}
          CHART_LIBRARY_CL11_CONTRACT_RESULT: ${{ steps.chart_library_cl11_contract.outcome }}
          OSR_W01_CONTRACT_RESULT: ${{ steps.osr_w01_contract.outcome }}
          PRODUCT_RECOVERY_POLICY_RESULT: ${{ steps.product_recovery_policy.outcome }}
          LEGACY_MBTILES_COMPATIBILITY_RESULT: ${{ steps.legacy_mbtiles_compatibility.outcome }}
          RELEASE_SURFACE_AUDIT_RESULT: ${{ steps.release_surface_audit.outcome }}
          GOOGLE_MAPS_EVIDENCE_RESULT: ${{ steps.google_maps_evidence.outcome }}
          RELEASE_METADATA_RESULT: ${{ steps.release_metadata.outcome }}
          CI_CONTRACT_RESULT: ${{ steps.ci_contract.outcome }}
          SECRETS_CONTRACT_RESULT: ${{ steps.secrets_contract.outcome }}
          UNIT_TEST_RESULT: ${{ steps.unit_tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
        run: |
          failed=0
          for result in CI_HELPERS_RESULT LAUNCHER_STAGE0_CONTRACT_RESULT NMEA_SOURCES_P0_CONTRACT_RESULT NMEA_SOURCES_P1_CONTRACT_RESULT NMEA_SOURCES_P3_CONTRACT_RESULT LAUNCHER_STAGE2_CONTRACT_RESULT LAUNCHER_STAGE25_CONTRACT_RESULT LAUNCHER_STAGE3_CONTRACT_RESULT LAUNCHER_STAGE4_CONTRACT_RESULT CHART_LIBRARY_CL11_CONTRACT_RESULT OSR_W01_CONTRACT_RESULT PRODUCT_RECOVERY_POLICY_RESULT LEGACY_MBTILES_COMPATIBILITY_RESULT RELEASE_SURFACE_AUDIT_RESULT GOOGLE_MAPS_EVIDENCE_RESULT RELEASE_METADATA_RESULT CI_CONTRACT_RESULT SECRETS_CONTRACT_RESULT UNIT_TEST_RESULT LINT_RESULT ASSEMBLE_RESULT; do
            if [ "${!result}" != success ]; then echo "::error title=$result failed::Open the job summary and FAILURE artifact."; failed=1; fi
          done
          exit "$failed"
      - name: Compute Codex report artifact identity
        if: always()
        id: codex_identity
        run: echo "sha12=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Build bounded Codex build-job report
        if: always()
        run: >-
          python3 .github/scripts/build_codex_job_report.py
          --job build
          --status '${{ job.status }}'
          --head-sha '${{ github.sha }}'
          --output build/codex-ci/job-report
      - name: Upload Codex build-job report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CODEX-JOB-build-${{ steps.codex_identity.outputs.sha12 }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/codex-ci/job-report
          if-no-files-found: error
          retention-days: 30

  integration:
    name: Protected adapters, migrations, and restore on API 34
    if: false # Historical implementation; not part of the experience build.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: Run protected MBTiles, Room, runtime, and restore suites
        id: api34_suite
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            bash .github/scripts/run_device_tests.sh all
            bash .github/scripts/run_c12_process_restore.sh
            bash .github/scripts/run_nmea_sources_process_restore.sh
      - name: Expose instrumented test failures
        if: failure()
        run: |
          python3 .github/scripts/report_android_test_failures.py \
            --result-root app-shell/build/outputs/androidTest-results \
            --result-root adapter/marine-data-android/build/outputs/androidTest-results \
            --result-root adapter/chart-library-android/build/outputs/androidTest-results \
            --result-root adapter/map-offline/build/outputs/androidTest-results \
            --result-root adapter/map-storage/build/outputs/androidTest-results
      - name: Extract Chart Library CL11 resource evidence
        if: always()
        run: >-
          python3 .github/scripts/extract_chart_library_cl11_evidence.py
          --root .
          --output build/chart-library-cl11/evidence.json
          --require-complete
      - name: Extract legacy MBTiles compatibility evidence
        if: always()
        run: >-
          python3 .github/scripts/extract_legacy_mbtiles_evidence.py
          --root .
          --output build/legacy-mbtiles/evidence.json
          --require-complete
      - name: Collect W16 API 34 migration and process-restore evidence
        id: osr_w16_api34_evidence
        if: false # PRODUCT_RECOVERY: final W16 acceptance ledger is suspended.
        run: >-
          python3 .github/scripts/collect_w16_machine_evidence.py
          --scope api34
          --output build/w16/w16-api34-evidence.json
          --migration-output build/w16/w16-migration-api34.json
          --require-complete
      - name: Device-test summary
        if: always()
        run: python3 .github/scripts/write_job_summary.py "API 34 real-Activity stories" "Instrumented tests=${{ job.status }}"
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-api34-reports-${{ github.sha }}
          path: |
            app-shell/build/reports/androidTests/**
            app-shell/build/outputs/androidTest-results/**
            adapter/marine-data-android/build/reports/androidTests/**
            adapter/marine-data-android/build/outputs/androidTest-results/**
            adapter/chart-library-android/build/reports/androidTests/**
            adapter/chart-library-android/build/outputs/androidTest-results/**
            adapter/map-offline/build/reports/androidTests/**
            adapter/map-offline/build/outputs/androidTest-results/**
            adapter/map-storage/build/reports/androidTests/**
            adapter/map-storage/build/outputs/androidTest-results/**
            build/ci-device-tests.log
            build/ci-c12-process-restore.log
            build/ci-nmea-sources-process-restore.log
            build/chart-library-cl11/evidence.json
            build/legacy-mbtiles/evidence.json
            build/w16/**
          if-no-files-found: warn
          retention-days: 14
      - name: Collect integration failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh integration-api34
      - name: Upload downloadable integration failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-integration-api34-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/integration-api34
          if-no-files-found: error
          retention-days: 30
      - name: Compute Codex report artifact identity
        if: always()
        id: codex_identity
        run: echo "sha12=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Build bounded Codex API 34 job report
        if: always()
        run: >-
          python3 .github/scripts/build_codex_job_report.py
          --job api34
          --status '${{ job.status }}'
          --head-sha '${{ github.sha }}'
          --output build/codex-ci/job-report
      - name: Upload Codex API 34 job report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CODEX-JOB-api34-${{ steps.codex_identity.outputs.sha12 }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/codex-ci/job-report
          if-no-files-found: error
