name: Yokuli OS Android CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TDD contract, unit, lint, and in-app Shell APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/requirements/stage0-schema.txt
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install pinned Draft 2020-12 schema validator
        run: python3 -m pip install --requirement .github/requirements/stage0-schema.txt
      - name: CI helper unit tests
        id: ci_helpers
        continue-on-error: true
        run: python3 -m unittest discover .github/scripts 'test_*.py'
      - name: Launcher Stage 0 reference contract
        id: launcher_stage0_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage0_contract.py
      - name: Release metadata contract
        id: release_metadata
        continue-on-error: true
        run: bash .github/scripts/test-resolve-release-metadata.sh
      - name: Workflow topology contract
        id: ci_contract
        continue-on-error: true
        run: bash .github/scripts/test-ci-contract.sh
      - name: Encrypted secrets workflow contract
        id: secrets_contract
        continue-on-error: true
        run: bash .github/scripts/test-secrets-manager.sh
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        timeout-minutes: 20
        run: ./gradlew --no-daemon test --stacktrace
      - name: Android lint
        id: lint
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew --no-daemon lintStandaloneDebug --stacktrace
      - name: Assemble standalone debug and release-audit APKs
        id: assemble
        continue-on-error: true
        timeout-minutes: 15
        run: ./gradlew --no-daemon assembleStandaloneDebug assembleStandaloneRelease --stacktrace
      - name: Launcher Stage 1 product-surface contract
        id: launcher_stage1_contract
        continue-on-error: true
        run: |
          python3 .github/scripts/test_launcher_stage1_contract.py
          bash .github/scripts/test-release-product-surface.sh
      - name: Launcher Stage 2 engine-boundary contract
        id: launcher_stage2_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage2_contract.py
      - name: Launcher Stage 2.5 WP8 reference-evidence contract
        id: launcher_stage25_contract
        continue-on-error: true
        run: |
          python3 .github/scripts/test_launcher_stage25_contract.py
          python3 .github/scripts/validate_wp8_reference.py --require-human-review
      - name: Launcher Stage 3 geometry and Start-document contract
        id: launcher_stage3_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage3_contract.py
      - name: Launcher Stage 4 deterministic Engine-state contract
        id: launcher_stage4_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage4_contract.py
      - name: Launcher Stage 5 interactive-pager contract
        id: launcher_stage5_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage5_contract.py
      - name: Launcher Stage 6 spatial-grid contract
        id: launcher_stage6_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage6_contract.py
      - name: Launcher Stage 7 complete-edit contract
        id: launcher_stage7_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage7_contract.py
      - name: Launcher Stage 8 pin/unpin contract
        id: launcher_stage8_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage8_contract.py
      - name: Launcher Stage 9 navigation and virtual-key contract
        id: launcher_stage9_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage9_contract.py
      - name: Launcher Stage 10 durable-restore and recovery contract
        id: launcher_stage10_contract
        continue-on-error: true
        run: python3 .github/scripts/test_launcher_stage10_contract.py
      - name: Launcher Stage 11 performance and fidelity candidate contract
        id: launcher_stage11_contract
        continue-on-error: true
        run: |
          python3 .github/scripts/test_launcher_stage11_contract.py
          python3 .github/scripts/validate_stage11_fidelity.py
      - name: Shell-App tile installation contract
        id: shell_app_contract
        continue-on-error: true
        run: python3 .github/scripts/test_shell_app_contract.py
      - name: Chart C12 cumulative delivery contract
        id: chart_c12_contract
        continue-on-error: true
        run: python3 .github/scripts/test_chart_c12_contract.py
      - name: Upload quality-gate candidate APKs
        if: steps.ci_helpers.outcome == 'success' && steps.launcher_stage0_contract.outcome == 'success' && steps.launcher_stage1_contract.outcome == 'success' && steps.launcher_stage2_contract.outcome == 'success' && steps.launcher_stage25_contract.outcome == 'success' && steps.launcher_stage3_contract.outcome == 'success' && steps.launcher_stage4_contract.outcome == 'success' && steps.launcher_stage5_contract.outcome == 'success' && steps.launcher_stage6_contract.outcome == 'success' && steps.launcher_stage7_contract.outcome == 'success' && steps.launcher_stage8_contract.outcome == 'success' && steps.launcher_stage9_contract.outcome == 'success' && steps.launcher_stage10_contract.outcome == 'success' && steps.launcher_stage11_contract.outcome == 'success' && steps.shell_app_contract.outcome == 'success' && steps.chart_c12_contract.outcome == 'success' && steps.release_metadata.outcome == 'success' && steps.ci_contract.outcome == 'success' && steps.secrets_contract.outcome == 'success' && steps.unit_tests.outcome == 'success' && steps.lint.outcome == 'success' && steps.assemble.outcome == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-debug-candidate-${{ github.sha }}
          path: |
            app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload explicitly unverified diagnostic APKs
        if: steps.assemble.outcome == 'success' && (steps.ci_helpers.outcome != 'success' || steps.launcher_stage0_contract.outcome != 'success' || steps.launcher_stage1_contract.outcome != 'success' || steps.launcher_stage2_contract.outcome != 'success' || steps.launcher_stage25_contract.outcome != 'success' || steps.launcher_stage3_contract.outcome != 'success' || steps.launcher_stage4_contract.outcome != 'success' || steps.launcher_stage5_contract.outcome != 'success' || steps.launcher_stage6_contract.outcome != 'success' || steps.launcher_stage7_contract.outcome != 'success' || steps.launcher_stage8_contract.outcome != 'success' || steps.launcher_stage9_contract.outcome != 'success' || steps.launcher_stage10_contract.outcome != 'success' || steps.launcher_stage11_contract.outcome != 'success' || steps.shell_app_contract.outcome != 'success' || steps.chart_c12_contract.outcome != 'success' || steps.release_metadata.outcome != 'success' || steps.ci_contract.outcome != 'success' || steps.secrets_contract.outcome != 'success' || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v7
        with:
          name: UNVERIFIED-yokuli-os-debug-${{ github.sha }}
          path: |
            app-shell/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload unit-test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-build-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Build gate summary and annotations
        if: always()
        run: >-
          python3 .github/scripts/write_job_summary.py "Build quality gate"
          "CI helper tests=${{ steps.ci_helpers.outcome }}"
          "Launcher Stage 0 contract=${{ steps.launcher_stage0_contract.outcome }}"
          "Launcher Stage 1 product surface=${{ steps.launcher_stage1_contract.outcome }}"
          "Launcher Stage 2 engine boundary=${{ steps.launcher_stage2_contract.outcome }}"
          "Launcher Stage 2.5 WP8 reference evidence=${{ steps.launcher_stage25_contract.outcome }}"
          "Launcher Stage 3 geometry and Start document=${{ steps.launcher_stage3_contract.outcome }}"
          "Launcher Stage 4 deterministic Engine state=${{ steps.launcher_stage4_contract.outcome }}"
          "Launcher Stage 5 interactive pager=${{ steps.launcher_stage5_contract.outcome }}"
          "Launcher Stage 6 spatial grid=${{ steps.launcher_stage6_contract.outcome }}"
          "Launcher Stage 7 complete edit=${{ steps.launcher_stage7_contract.outcome }}"
          "Launcher Stage 8 pin and unpin=${{ steps.launcher_stage8_contract.outcome }}"
          "Launcher Stage 9 navigation and virtual keys=${{ steps.launcher_stage9_contract.outcome }}"
          "Launcher Stage 10 durable restore and recovery=${{ steps.launcher_stage10_contract.outcome }}"
          "Launcher Stage 11 performance and fidelity candidates=${{ steps.launcher_stage11_contract.outcome }}"
          "Shell-App tile installation contract=${{ steps.shell_app_contract.outcome }}"
          "Chart C12 cumulative delivery=${{ steps.chart_c12_contract.outcome }}"
          "Release metadata=${{ steps.release_metadata.outcome }}"
          "Workflow contract=${{ steps.ci_contract.outcome }}"
          "Encrypted secrets contract=${{ steps.secrets_contract.outcome }}"
          "Unit tests=${{ steps.unit_tests.outcome }}"
          "Android lint=${{ steps.lint.outcome }}"
          "Debug plus release-audit APK compile=${{ steps.assemble.outcome }}"
      - name: Collect build failure diagnostics
        if: always() && (failure() || steps.ci_helpers.outcome != 'success' || steps.launcher_stage0_contract.outcome != 'success' || steps.launcher_stage1_contract.outcome != 'success' || steps.launcher_stage2_contract.outcome != 'success' || steps.launcher_stage25_contract.outcome != 'success' || steps.launcher_stage3_contract.outcome != 'success' || steps.launcher_stage4_contract.outcome != 'success' || steps.launcher_stage5_contract.outcome != 'success' || steps.launcher_stage6_contract.outcome != 'success' || steps.launcher_stage7_contract.outcome != 'success' || steps.launcher_stage8_contract.outcome != 'success' || steps.launcher_stage9_contract.outcome != 'success' || steps.launcher_stage10_contract.outcome != 'success' || steps.launcher_stage11_contract.outcome != 'success' || steps.shell_app_contract.outcome != 'success' || steps.chart_c12_contract.outcome != 'success' || steps.release_metadata.outcome != 'success' || steps.ci_contract.outcome != 'success' || steps.secrets_contract.outcome != 'success' || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success' || steps.assemble.outcome != 'success')
        run: bash .github/scripts/collect_failure_bundle.sh build
      - name: Upload downloadable build failure bundle
        if: always() && (failure() || steps.ci_helpers.outcome != 'success' || steps.launcher_stage0_contract.outcome != 'success' || steps.launcher_stage1_contract.outcome != 'success' || steps.launcher_stage2_contract.outcome != 'success' || steps.launcher_stage25_contract.outcome != 'success' || steps.launcher_stage3_contract.outcome != 'success' || steps.launcher_stage4_contract.outcome != 'success' || steps.launcher_stage5_contract.outcome != 'success' || steps.launcher_stage6_contract.outcome != 'success' || steps.launcher_stage7_contract.outcome != 'success' || steps.launcher_stage8_contract.outcome != 'success' || steps.launcher_stage9_contract.outcome != 'success' || steps.launcher_stage10_contract.outcome != 'success' || steps.launcher_stage11_contract.outcome != 'success' || steps.shell_app_contract.outcome != 'success' || steps.chart_c12_contract.outcome != 'success' || steps.release_metadata.outcome != 'success' || steps.ci_contract.outcome != 'success' || steps.secrets_contract.outcome != 'success' || steps.unit_tests.outcome != 'success' || steps.lint.outcome != 'success' || steps.assemble.outcome != 'success')
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/build
          if-no-files-found: error
          retention-days: 30
      - name: Enforce build quality gate
        if: always()
        env:
          CI_HELPERS_RESULT: ${{ steps.ci_helpers.outcome }}
          LAUNCHER_STAGE0_CONTRACT_RESULT: ${{ steps.launcher_stage0_contract.outcome }}
          LAUNCHER_STAGE1_CONTRACT_RESULT: ${{ steps.launcher_stage1_contract.outcome }}
          LAUNCHER_STAGE2_CONTRACT_RESULT: ${{ steps.launcher_stage2_contract.outcome }}
          LAUNCHER_STAGE25_CONTRACT_RESULT: ${{ steps.launcher_stage25_contract.outcome }}
          LAUNCHER_STAGE3_CONTRACT_RESULT: ${{ steps.launcher_stage3_contract.outcome }}
          LAUNCHER_STAGE4_CONTRACT_RESULT: ${{ steps.launcher_stage4_contract.outcome }}
          LAUNCHER_STAGE5_CONTRACT_RESULT: ${{ steps.launcher_stage5_contract.outcome }}
          LAUNCHER_STAGE6_CONTRACT_RESULT: ${{ steps.launcher_stage6_contract.outcome }}
          LAUNCHER_STAGE7_CONTRACT_RESULT: ${{ steps.launcher_stage7_contract.outcome }}
          LAUNCHER_STAGE8_CONTRACT_RESULT: ${{ steps.launcher_stage8_contract.outcome }}
          LAUNCHER_STAGE9_CONTRACT_RESULT: ${{ steps.launcher_stage9_contract.outcome }}
          LAUNCHER_STAGE10_CONTRACT_RESULT: ${{ steps.launcher_stage10_contract.outcome }}
          LAUNCHER_STAGE11_CONTRACT_RESULT: ${{ steps.launcher_stage11_contract.outcome }}
          SHELL_APP_CONTRACT_RESULT: ${{ steps.shell_app_contract.outcome }}
          CHART_C12_CONTRACT_RESULT: ${{ steps.chart_c12_contract.outcome }}
          RELEASE_METADATA_RESULT: ${{ steps.release_metadata.outcome }}
          CI_CONTRACT_RESULT: ${{ steps.ci_contract.outcome }}
          SECRETS_CONTRACT_RESULT: ${{ steps.secrets_contract.outcome }}
          UNIT_TEST_RESULT: ${{ steps.unit_tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
        run: |
          failed=0
          for result in CI_HELPERS_RESULT LAUNCHER_STAGE0_CONTRACT_RESULT LAUNCHER_STAGE1_CONTRACT_RESULT LAUNCHER_STAGE2_CONTRACT_RESULT LAUNCHER_STAGE25_CONTRACT_RESULT LAUNCHER_STAGE3_CONTRACT_RESULT LAUNCHER_STAGE4_CONTRACT_RESULT LAUNCHER_STAGE5_CONTRACT_RESULT LAUNCHER_STAGE6_CONTRACT_RESULT LAUNCHER_STAGE7_CONTRACT_RESULT LAUNCHER_STAGE8_CONTRACT_RESULT LAUNCHER_STAGE9_CONTRACT_RESULT LAUNCHER_STAGE10_CONTRACT_RESULT LAUNCHER_STAGE11_CONTRACT_RESULT SHELL_APP_CONTRACT_RESULT CHART_C12_CONTRACT_RESULT RELEASE_METADATA_RESULT CI_CONTRACT_RESULT SECRETS_CONTRACT_RESULT UNIT_TEST_RESULT LINT_RESULT ASSEMBLE_RESULT; do
            if [ "${!result}" != success ]; then echo "::error title=$result failed::Open the job summary and FAILURE artifact."; failed=1; fi
          done
          exit "$failed"

  integration:
    name: Chart MBTiles, Room, and WP8 Shell on API 34
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: Run MBTiles + Room + Shell device suites with motion enabled
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            bash .github/scripts/run_device_tests.sh all
      - name: Expose instrumented test failures
        if: failure()
        run: python3 .github/scripts/report_android_test_failures.py
      - name: Device-test summary
        if: always()
        run: python3 .github/scripts/write_job_summary.py "API 34 real-Activity stories" "Instrumented tests=${{ job.status }}"
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-api34-reports-${{ github.sha }}
          path: |
            app-shell/build/reports/androidTests/**
            app-shell/build/outputs/androidTest-results/**
            adapter/map-offline/build/reports/androidTests/**
            adapter/map-offline/build/outputs/androidTest-results/**
            adapter/map-storage/build/reports/androidTests/**
            adapter/map-storage/build/outputs/androidTest-results/**
            build/ci-device-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Collect integration failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh integration-api34
      - name: Upload downloadable integration failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-integration-api34-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/integration-api34
          if-no-files-found: error
          retention-days: 30

  api-compatibility:
    name: Android 16 / API 36 reduced-motion smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: API 36 launch smoke with platform animation scale disabled
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            bash .github/scripts/run_device_tests.sh smoke
      - name: Expose API compatibility failures
        if: failure()
        run: python3 .github/scripts/report_android_test_failures.py
      - name: Compatibility summary
        if: always()
        run: python3 .github/scripts/write_job_summary.py "API 36 compatibility" "Reduced-motion smoke=${{ job.status }}"
      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yokuli-os-api36-reports-${{ github.sha }}
          path: |
            app-shell/build/reports/androidTests/**
            app-shell/build/outputs/androidTest-results/**
            build/ci-device-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Collect API compatibility failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh compatibility-api36
      - name: Upload downloadable API compatibility failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-compatibility-api36-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/compatibility-api36
          if-no-files-found: error
          retention-days: 30

  stage11-performance:
    name: Stage 11 API 34 emulator performance trend
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Enable KVM hardware acceleration
        run: bash .github/scripts/enable_kvm.sh
      - name: Run Macrobenchmark journeys as a non-hardware trend gate
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu auto -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            bash .github/scripts/run_device_tests.sh performance
      - name: Expose Macrobenchmark failures
        if: failure()
        run: >-
          python3 .github/scripts/report_android_test_failures.py
          --result-root benchmark/shell/build/outputs/androidTest-results
      - name: Summarize AndroidX measurements without inventing a physical-device pass
        if: always()
        run: >-
          python3 .github/scripts/summarize_stage11_performance.py
          --search benchmark/shell/build
          --output build/stage11-performance/summary.json
          --require-journeys
      - name: Stage 11 performance summary
        if: always()
        run: >-
          python3 .github/scripts/write_job_summary.py "Stage 11 emulator performance trend"
          "Macrobenchmark journeys=${{ job.status }}"
          "Physical 60/90/120 Hz and Samsung square=UNVERIFIED_HARDWARE"
      - name: Upload Stage 11 performance traces and trend data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage11-performance-reports
          path: |
            benchmark/shell/build/outputs/**
            benchmark/shell/build/reports/**
            build/stage11-performance/**
            build/ci-device-tests.log
          if-no-files-found: warn
          retention-days: 30
      - name: Collect Stage 11 performance failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh stage11-performance
      - name: Upload downloadable Stage 11 performance failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-stage11-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/stage11-performance
          if-no-files-found: error
          retention-days: 30

  verified-debug:
    name: Publish fully verified alpha APK
    needs: [build, integration, api-compatibility, stage11-performance]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download quality-gate candidate with digest verification
        uses: actions/download-artifact@v8
        with:
          name: yokuli-os-debug-candidate-${{ github.sha }}
          path: verified-apk
      - name: Upload fully verified installable alpha APK
        uses: actions/upload-artifact@v7
        with:
          name: VERIFIED-yokuli-os-alpha-${{ github.sha }}
          path: verified-apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Verified artifact summary
        run: |
          {
            echo '## Fully verified Yokuli OS alpha APK'
            echo 'TDD contracts, unit tests, lint, Release audit, API 34 MBTiles + Room + Shell suites, API 36 smoke, and emulator performance journeys all passed.'
            echo 'Download: **VERIFIED-yokuli-os-alpha-${{ github.sha }}**'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Collect verified-artifact failure diagnostics
        if: failure()
        run: bash .github/scripts/collect_failure_bundle.sh verified-debug
      - name: Upload downloadable verified-artifact failure bundle
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FAILURE-verified-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github-failure-bundle/verified-debug
          if-no-files-found: error
          retention-days: 30
