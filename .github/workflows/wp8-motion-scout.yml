name: WP8 motion evidence scout

on:
  push:
    branches:
      - codex/launcher-engine-stage2.5
    paths:
      - .github/workflows/wp8-motion-scout.yml

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/launcher-engine-stage2.5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install scout dependencies
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          python -m pip install --disable-pip-version-check requests pillow

      - name: Download accessible licensed videos and build contact sheets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from PIL import Image, ImageDraw

          ROOT = Path('docs/reference/wp8/artifacts/motion-scout')
          ROOT.mkdir(parents=True, exist_ok=True)
          TMP = Path('/tmp/wp8-motion-scout')
          TMP.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers['User-Agent'] = 'Yokuli-WP8-Motion-Scout/1.1 (+https://github.com/ohkuku/yokuli_marine_shell)'

          explicit = [
              'Rev3_Mobile_Geeks_Reviews_100',
              'TechnoBuffalo_269',
              'youtube-jqRyK19xOgM',
          ]
          discovery_path = Path('docs/reference/wp8/artifacts/ia-motion-candidates.json')
          discovery = json.loads(discovery_path.read_text(encoding='utf-8')) if discovery_path.exists() else {'items': []}

          def text(value: object) -> str:
              if isinstance(value, list):
                  return ' '.join(map(str, value))
              return str(value or '')

          def doc_score(doc: dict) -> tuple[int, int, str]:
              haystack = (text(doc.get('title')) + ' ' + text(doc.get('description'))).lower()
              score = 0
              for needle, weight in {
                  'walkthrough': -120,
                  'hands on': -100,
                  'hands-on': -100,
                  'review': -80,
                  'shortcomings': -70,
                  'windows phone 8': -60,
                  'lumia 920': -50,
                  'lumia 820': -40,
                  'lumia 620': -40,
                  'interface': -40,
                  'operating system': -30,
                  'unboxing': -20,
                  'rumor': 120,
                  'coming': 80,
                  'iphone': 60,
                  'news today': 50,
              }.items():
                  if needle in haystack:
                      score += weight
              license_url = text(doc.get('licenseurl')).lower()
              if 'creativecommons.org' not in license_url and 'publicdomain' not in license_url:
                  score += 1000
              return score, -int(doc.get('downloads') or 0), text(doc.get('identifier'))

          docs_by_id = {
              text(doc.get('identifier')): doc
              for doc in discovery.get('items', [])
              if doc.get('identifier')
          }
          ordered_ids: list[str] = []
          for identifier in explicit:
              if identifier not in ordered_ids:
                  ordered_ids.append(identifier)
          for doc in sorted(discovery.get('items', []), key=doc_score):
              identifier = text(doc.get('identifier'))
              if identifier and identifier not in ordered_ids:
                  ordered_ids.append(identifier)

          def file_candidates(files: list[dict]) -> list[dict]:
              ranked: list[tuple[int, int, dict]] = []
              for item in files:
                  name = text(item.get('name'))
                  lower = name.lower()
                  if not lower.endswith(('.mp4', '.m4v', '.ogv', '.webm', '.avi', '.mov')):
                      continue
                  size = int(item.get('size') or 0)
                  if not (1_000_000 <= size <= 500_000_000):
                      continue
                  if text(item.get('private')).lower() in {'true', '1'}:
                      continue
                  fmt = text(item.get('format')).lower()
                  source = text(item.get('source')).lower()
                  score = 0
                  if source == 'derivative':
                      score -= 200
                  if lower.endswith('.mp4'):
                      score -= 120
                  if '512kb' in lower or '512kb' in fmt:
                      score -= 80
                  if 'mpeg4' in fmt or 'mpeg-4' in fmt or 'h.264' in fmt:
                      score -= 40
                  if 'sample' in lower or 'trailer' in lower or 'thumb' in lower:
                      score += 1000
                  ranked.append((score, size, item))
              ranked.sort(key=lambda value: (value[0], value[1]))
              return [item for _, _, item in ranked]

          def probe_url(identifier: str, name: str) -> tuple[str | None, str | None]:
              encoded = quote(name, safe='')
              urls = [
                  f'https://archive.org/download/{identifier}/{encoded}?download=1',
                  f'https://archive.org/download/{identifier}/{encoded}',
              ]
              errors = []
              for url in urls:
                  try:
                      response = session.get(
                          url,
                          headers={'Range': 'bytes=0-65535'},
                          stream=True,
                          allow_redirects=True,
                          timeout=45,
                      )
                      status = response.status_code
                      content_type = response.headers.get('content-type', '')
                      first = next(response.iter_content(chunk_size=65536), b'')
                      final_url = response.url
                      response.close()
                      if status in {200, 206} and len(first) >= 1024 and 'text/html' not in content_type.lower():
                          return url, None
                      errors.append(f'{status} {content_type} {final_url}')
                  except Exception as error:  # diagnostic scout; continue to other derivatives
                      errors.append(repr(error))
              return None, '; '.join(errors)

          def download(url: str, destination: Path) -> tuple[str, int]:
              digest = hashlib.sha256()
              total = 0
              with session.get(url, stream=True, allow_redirects=True, timeout=300) as response:
                  response.raise_for_status()
                  with destination.open('wb') as handle:
                      for chunk in response.iter_content(chunk_size=1024 * 1024):
                          if not chunk:
                              continue
                          handle.write(chunk)
                          digest.update(chunk)
                          total += len(chunk)
              return digest.hexdigest(), total

          manifest: dict[str, object] = {
              'scoutVersion': 2,
              'attemptedItems': [],
              'selectedItems': [],
          }
          selected_count = 0
          for identifier in ordered_ids[:40]:
              if selected_count >= 4:
                  break
              attempt: dict[str, object] = {'identifier': identifier, 'fileAttempts': []}
              manifest['attemptedItems'].append(attempt)
              try:
                  meta_response = session.get(f'https://archive.org/metadata/{identifier}', timeout=90)
                  meta_response.raise_for_status()
                  meta = meta_response.json()
              except Exception as error:
                  attempt['metadataError'] = repr(error)
                  continue

              metadata = meta.get('metadata', {})
              license_url = text(metadata.get('licenseurl') or docs_by_id.get(identifier, {}).get('licenseurl'))
              if 'creativecommons.org' not in license_url.lower() and 'publicdomain' not in license_url.lower():
                  attempt['skipReason'] = f'No explicit open license: {license_url!r}'
                  continue

              selected_file = None
              selected_url = None
              for item in file_candidates(meta.get('files', [])):
                  name = text(item.get('name'))
                  url, error = probe_url(identifier, name)
                  attempt['fileAttempts'].append({
                      'name': name,
                      'size': int(item.get('size') or 0),
                      'format': item.get('format'),
                      'source': item.get('source'),
                      'private': item.get('private'),
                      'available': url is not None,
                      'probeError': error,
                  })
                  if url:
                      selected_file = item
                      selected_url = url
                      break
              if not selected_file or not selected_url:
                  attempt['skipReason'] = 'No publicly downloadable video derivative'
                  continue

              suffix = Path(text(selected_file.get('name'))).suffix.lower() or '.mp4'
              video_path = TMP / f'{identifier}{suffix}'
              try:
                  sha256, byte_size = download(selected_url, video_path)
                  duration_text = subprocess.check_output([
                      'ffprobe', '-v', 'error', '-show_entries', 'format=duration',
                      '-of', 'default=noprint_wrappers=1:nokey=1', str(video_path),
                  ], text=True).strip()
                  duration = float(duration_text)
              except Exception as error:
                  attempt['downloadError'] = repr(error)
                  continue

              sample_count = min(72, max(24, math.ceil(duration / 12.0)))
              times = [duration * (index + 0.5) / sample_count for index in range(sample_count)]
              frame_dir = TMP / f'{identifier}-frames'
              frame_dir.mkdir(exist_ok=True)
              frames: list[tuple[float, Image.Image]] = []
              for index, timestamp in enumerate(times):
                  frame_path = frame_dir / f'{index:03d}.jpg'
                  subprocess.run([
                      'ffmpeg', '-hide_banner', '-loglevel', 'error', '-ss', f'{timestamp:.3f}',
                      '-i', str(video_path), '-frames:v', '1', '-vf', 'scale=320:-2',
                      '-q:v', '3', '-y', str(frame_path),
                  ], check=True)
                  with Image.open(frame_path) as image:
                      frames.append((timestamp, image.convert('RGB').copy()))

              columns = 4
              cell_w = 320
              image_h = max(image.height for _, image in frames)
              cell_h = image_h + 30
              rows = math.ceil(len(frames) / columns)
              sheet = Image.new('RGB', (columns * cell_w, rows * cell_h), 'black')
              draw = ImageDraw.Draw(sheet)
              for index, (timestamp, image) in enumerate(frames):
                  x = (index % columns) * cell_w
                  y = (index // columns) * cell_h
                  sheet.paste(image, (x, y + 22))
                  draw.text((x + 4, y + 4), f'{index:02d}  {timestamp:8.2f}s', fill='white')
              sheet_path = ROOT / f'{identifier}-contact-sheet.jpg'
              sheet.save(sheet_path, quality=88, optimize=True)

              record = {
                  'identifier': identifier,
                  'detailsUrl': f'https://archive.org/details/{identifier}',
                  'title': metadata.get('title'),
                  'creator': metadata.get('creator'),
                  'date': metadata.get('date'),
                  'licenseurl': license_url,
                  'rights': metadata.get('rights'),
                  'description': metadata.get('description'),
                  'selectedFile': {
                      'name': selected_file.get('name'),
                      'format': selected_file.get('format'),
                      'size': int(selected_file.get('size') or byte_size),
                      'source': selected_file.get('source'),
                      'md5': selected_file.get('md5'),
                      'sha1': selected_file.get('sha1'),
                      'downloadUrl': selected_url,
                      'downloadedSha256': sha256,
                      'downloadedByteSize': byte_size,
                  },
                  'durationSeconds': duration,
                  'contactSheet': str(sheet_path),
                  'contactSheetSha256': hashlib.sha256(sheet_path.read_bytes()).hexdigest(),
                  'samples': [
                      {'index': index, 'timestampSeconds': round(timestamp, 3)}
                      for index, (timestamp, _) in enumerate(frames)
                  ],
              }
              manifest['selectedItems'].append(record)
              attempt['selected'] = True
              selected_count += 1

          (ROOT / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          if selected_count == 0:
              raise SystemExit('No accessible, explicitly licensed WP8 motion candidate was found')
          PY

      - name: Commit motion scouting artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/wp8/artifacts/motion-scout
          if git diff --cached --quiet; then
            echo "No motion scouting changes"
            exit 0
          fi
          git commit -m "docs(shell): scout licensed wp8 motion sources"
          git push origin HEAD:codex/launcher-engine-stage2.5
