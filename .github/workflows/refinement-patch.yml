name: Materialize reviewed refinement
on:
  push:
    branches: [codex/shell-map-contract]
    paths: [.github/refinement/apply.py, .github/workflows/refinement-patch.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'ohkuku/yokuli_marine_shell'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Apply reviewed textual edits
        run: python3 .github/refinement/apply.py
      - name: Create commit object only, do not update refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          subprocess.run(['git', 'add', '--', 'core', 'feature', 'adapter', 'app-shell', 'ui', 'benchmark', 'baselineprofile', 'docs', 'gradle', '.github/scripts', 'CHANGELOG.md'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          changed = list(filter(None, subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z', '--no-renames']).decode().split('\0')))
          allowed = ('core/', 'feature/', 'adapter/', 'app-shell/', 'ui/', 'benchmark/', 'baselineprofile/', 'docs/', 'gradle/', '.github/scripts/')
          entries = []
          for name in changed:
              assert '..' not in pathlib.PurePosixPath(name).parts and (name.startswith(allowed) or name == 'CHANGELOG.md'), name
              indexed = subprocess.check_output(['git', 'ls-files', '-s', '--', name]).decode()
              if not indexed:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              mode = indexed.split()[0]
              assert mode in ('100644', '100755')
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'content': subprocess.check_output(['git', 'show', ':' + name]).decode('utf-8')})
          assert entries, 'No production edits'
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'ohkuku/yokuli_marine_shell'
          def post(endpoint, payload):
              result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/' + repo + endpoint, '--input', '-'], input=json.dumps(payload), text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip()
          created_tree = post('/git/trees', {'base_tree': tree, 'tree': entries})
          message = pathlib.Path('/tmp/refinement-message.txt').read_text().strip()
          commit = post('/git/commits', {'message': message, 'tree': created_tree['sha'], 'parents': [parent]})
          result = {'parent': parent, 'sha': commit['sha'], 'tree': created_tree['sha'], 'changed_files': changed}
          pathlib.Path('/tmp/proposed-commit.json').write_text(json.dumps(result, indent=2))
          print('PROPOSED_COMMIT_SHA=' + commit['sha'])
          print('PARENT_SHA=' + parent)
          print('No branch ref was modified by this workflow.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: refinement-proposed-commit-${{ github.sha }}
          path: /tmp/proposed-commit.json
          retention-days: 1
