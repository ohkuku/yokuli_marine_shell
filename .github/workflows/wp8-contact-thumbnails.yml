name: WP8 contact-sheet thumbnails

on:
  push:
    branches:
      - codex/launcher-engine-stage2.5
    paths:
      - .github/workflows/wp8-contact-thumbnails.yml

permissions:
  contents: write

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/launcher-engine-stage2.5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python -m pip install --disable-pip-version-check pillow

      - name: Build compact review sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('docs/reference/wp8/artifacts/motion-scout')
          for path in root.glob('*-contact-sheet.jpg'):
              if path.name.endswith('-small.jpg'):
                  continue
              with Image.open(path) as image:
                  image = image.convert('RGB')
                  width = 640
                  height = max(1, round(image.height * width / image.width))
                  resized = image.resize((width, height), Image.Resampling.LANCZOS)
                  output = path.with_name(path.stem + '-small.jpg')
                  resized.save(output, quality=52, optimize=True, progressive=True)
                  print(output, output.stat().st_size)
          PY

      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reference/wp8/artifacts/motion-scout/*-small.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(shell): add compact wp8 motion review sheets"
          git push origin HEAD:codex/launcher-engine-stage2.5
